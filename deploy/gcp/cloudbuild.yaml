substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: focusflow
  _SERVICE: focusflow-api
  _IMAGE: focusflow-api
  _SERVICE_ACCOUNT: focusflow-api
  _GOOGLE_OAUTH_CLIENT_ID: 1093941638042-h6b0ogrnj6jhe959usdqnjqbh6hlrg92.apps.googleusercontent.com
  _CONCURRENCY: "4"
  _MIN_INSTANCES: "1"
  _MAX_INSTANCES: "60"
  _RELEASE_BASE_URL: https://storage.googleapis.com/${PROJECT_ID}-focusflow-releases/releases/latest
  _MODEL_GCS_URI: gs://${PROJECT_ID}-focusflow-releases/models/triple_xgb_depth_robust_target_band_product.zip

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

steps:
  # The product model bundle is intentionally not committed to Git. Fetch it
  # from Cloud Storage into the Cloud Build workspace before Docker receives
  # its build context.
  - id: fetch-triple-xgb-artifact
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        rm -rf models/triple_xgb_depth_robust_target_band_product
        mkdir -p models/triple_xgb_depth_robust_target_band_product
        gcloud storage cp "${_MODEL_GCS_URI}" /workspace/triple_xgb_depth_robust_target_band_product.zip
        python3 -m zipfile -e /workspace/triple_xgb_depth_robust_target_band_product.zip models/triple_xgb_depth_robust_target_band_product
        test -s models/triple_xgb_depth_robust_target_band_product/fusion_config.json
        test -s models/triple_xgb_depth_robust_target_band_product/summary.json
        test -s models/triple_xgb_depth_robust_target_band_product/final_xgb/model.json
        test -s models/triple_xgb_depth_robust_target_band_product/boost_xgb/model.json
        test -s models/triple_xgb_depth_robust_target_band_product/targeted_xgb/model.json

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - deploy/gcp/Dockerfile.api
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --execution-environment=gen2
      - --ingress=all
      - --allow-unauthenticated
      - --service-account=${_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com
      - --cpu=2
      - --memory=2Gi
      - --concurrency=${_CONCURRENCY}
      - --timeout=3600
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --cpu-boost
      - --no-cpu-throttling
      - --set-env-vars=^@^FOCUSFLOW_ENV=production@FOCUSFLOW_REPOSITORY=firestore@FOCUSFLOW_EVENT_BACKEND=pubsub@FOCUSFLOW_PUBSUB_SESSION_EVENTS_TOPIC=focusflow-session-events@FOCUSFLOW_FIRESTORE_SESSIONS_COLLECTION=focusflow_sessions@FOCUSFLOW_FIRESTORE_USERS_COLLECTION=focusflow_users@FOCUSFLOW_TRIPLE_XGB_MODEL_DIR=/app/models/triple_xgb_depth_robust_target_band_product@FOCUSFLOW_GOOGLE_OAUTH_CLIENT_ID=${_GOOGLE_OAUTH_CLIENT_ID}@FOCUSFLOW_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000@FOCUSFLOW_STALE_SESSION_TIMEOUT_SECONDS=600@FOCUSFLOW_STALE_SESSION_CLEANUP_INTERVAL_SECONDS=60@FOCUSFLOW_RELEASE_VERSION=${SHORT_SHA}@FOCUSFLOW_RELEASE_BASE_URL=${_RELEASE_BASE_URL}@GOOGLE_CLOUD_PROJECT=${PROJECT_ID}
      - --update-labels=model=triple-xgb-depth,feature-schema=depth-robust-v2,build-sha=${SHORT_SHA}
      - --set-secrets=FOCUSFLOW_API_KEY=focusflow-api-key:latest

  - id: verify-readyz
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        service_url="$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format='value(status.url)')"
        curl --fail --silent --show-error "${service_url}/readyz"

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest
